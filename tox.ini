[tox]
envlist = py38,py39,py310,py311,py312,flake8,mypy,black,docs
isolated_build = true

[testenv]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    hypothesis>=6.70.0
commands = 
    pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html

[testenv:flake8]
deps = flake8>=6.0.0
commands = flake8 src/ tests/

[testenv:mypy]
deps = 
    mypy>=1.0.0
    types-setuptools
    types-requests
commands = mypy src/

[testenv:black]
deps = black>=23.0.0
commands = 
    black --check --diff src/ tests/

[testenv:isort]
deps = isort>=5.12.0
commands = 
    isort --check-only --diff src/ tests/

[testenv:docs]
deps = 
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
    myst-parser>=1.0.0
commands = 
    sphinx-build -W -b html docs docs/_build/html

[testenv:integration]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands = 
    pytest tests/integration/ -v --integration

[testenv:performance]
deps = 
    pytest>=7.0.0
    pytest-benchmark>=4.0.0
commands = 
    pytest tests/performance/ -v --benchmark-only

[testenv:security]
deps = 
    bandit>=1.7.0
    safety>=2.0.0
commands = 
    bandit -r src/
    safety check

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .tox,
    .eggs,
    *.egg-info

[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow tests